<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

#box{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 48px))}
h1{font-size:22px;font-weight:600;margin:0 0 10px}p{margin:6px 0}.s{font-size:12.5px;opacity:.72;margin-top:16px}

form{display:flex;gap:8px;margin-top:14px}#pf{flex-wrap:wrap}#who{display:flex;gap:8px;flex:0 0 100%}input{flex:1;min-width:0;padding:9px 11px;border-radius:6px;border:1px solid #ffffff55;background:#ffffff14;color:#fff;font:inherit}

.err{color:#ffd0cc}[hidden]{display:none!important}
</style></head><body>
<div id="box"><h1 id="h">正在打开</h1><p id="msg">请稍候。</p><div id="bar"><i id="barI"></i></div>
<form id="f" hidden><input id="code" autocomplete="off" spellcheck="false" placeholder="把收到的完整链接粘贴到这里"><button>打开</button></form>
<form id="pf" hidden><div id="who" hidden><input id="wc" autocomplete="organization" spellcheck="false" maxlength="80" placeholder="公司名称 Company"><input id="wn" autocomplete="name" spellcheck="false" maxlength="60" placeholder="姓名 Name"></div><input id="pw" autocomplete="off" spellcheck="false" placeholder="访问密码 Password"><button>确定</button></form>
<form id="rf" hidden><button>重试</button></form>
<p class="s">请用电脑上的 Edge 或 Chrome 打开。第一次打开要下载约 7 兆，照片和全景按点开的位置继续下载。链接里带有访问码，请不要转发给无关的人。<span id="note"></span></p></div>
<script>setTimeout(function () { if (!window.__sv) { document.getElementById('h').textContent = '没有打开'; document.getElementById('msg').textContent = '这个浏览器太旧，或者处在兼容模式，打不开。请用电脑上新版的 Edge 或 Chrome；360、QQ 等浏览器请切到“极速模式”。'; document.getElementById('bar').style.display = 'none' } }, 1500)</script>
